[package]
name = "my-project"
version = "0.1.0"
edition = "2021"
description = "A Rust project scaffold that follows the RustForge workflow."
license = "MIT OR Apache-2.0"

[dependencies]
# Errors as types: thiserror for libraries, anyhow for binaries.
thiserror = "2"
# Structured data: tool calls, events, and state all serialize through serde.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[profile.release]
lto = true
